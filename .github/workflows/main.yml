name: Auto Build and Release Deepseek-TUI Windows ARM64

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 0 点运行
  workflow_dispatch:     # 可手动触发

jobs:
  build-win-arm:
    runs-on: windows-latest
    env:
      SRC_REPO: Hmbown/DeepSeek-TUI
      RELEASE_REPO: sakuraflows/deepseek-tui_winarm
      LLVM_VERSION: 22.1.6
      SDK_VERSION: 10.0.22621.0

    steps:
    - name: Checkout self repo
      uses: actions/checkout@v3

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Add Rust target for Windows ARM64
      run: rustup target add aarch64-pc-windows-msvc

    # ==========================
    # 获取源项目最新 tag（PowerShell 兼容 Windows runner）
    # ==========================
    - name: Get latest tag from source repo
      id: latest_tag
      shell: pwsh
      run: |
        git init src
        Set-Location src
        git remote add origin https://github.com/${{ env.SRC_REPO }}.git
        git fetch --tags --quiet
        $latest_tag = git tag --sort=-creatordate | Select-Object -First 1
        Write-Host "Latest tag: $latest_tag"
        echo "LATEST_TAG=$latest_tag" >> $env:GITHUB_ENV

    # ==========================
    # 检查 release 是否已存在
    # ==========================
    - name: Check if release already exists
      id: check_release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: 'sakuraflows',
            repo: 'deepseek-tui_winarm',
          });
          const exists = releases.data.some(r => r.tag_name === process.env.LATEST_TAG);
          if (exists) {
            core.info(`Release with tag ${process.env.LATEST_TAG} already exists. Skipping build.`);
            core.setOutput('skip', 'true');
          } else {
            core.setOutput('skip', 'false');
          }

    - name: Stop if release exists
      if: steps.check_release.outputs.skip == 'true'
      run: exit 0

    # ==========================
    # Checkout 源代码
    # ==========================
    - name: Checkout source repo at latest tag
      run: git clone --branch $env:LATEST_TAG https://github.com/${{ env.SRC_REPO }}.git deepseek-tui
      shell: pwsh

    # ==========================
    # 缓存 LLVM
    # ==========================
    - name: Cache LLVM
      uses: actions/cache@v3
      with:
        path: llvm
        key: llvm-${{ env.LLVM_VERSION }}

    - name: Download LLVM prebuilt for Windows ARM64
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-aarch64-pc-windows-msvc.zip -OutFile llvm.zip
        Expand-Archive llvm.zip -DestinationPath llvm

    - name: Add LLVM to PATH
      shell: pwsh
      run: |
        $LLVM_BIN = Resolve-Path "llvm\clang+llvm-${{ env.LLVM_VERSION }}-aarch64-pc-windows-msvc\bin"
        echo "LLVM_PATH=$LLVM_BIN" >> $env:GITHUB_ENV
        $env:PATH = "$LLVM_BIN;$env:PATH"

    # ==========================
    # Windows SDK 安装
    # ==========================
    - name: Install Windows 11 SDK
      shell: powershell
      run: choco install windows-sdk-10-version-22621-all -y

    # ==========================
    # 缓存 Rust/Cargo
    # ==========================
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          **/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # ==========================
    # 构建 exe
    # ==========================
    - name: Build Deepseek-TUI exe
      shell: pwsh
      run: |
        Set-Location deepseek-tui
        cargo build --release --target aarch64-pc-windows-msvc

    - name: Prepare artifacts
      shell: pwsh
      run: |
        mkdir release
        Copy-Item deepseek-tui\target\aarch64-pc-windows-msvc\release\deepseek-tui.exe release\

    # ==========================
    # 发布 release
    # ==========================
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.LATEST_TAG }}
        release_name: ${{ env.LATEST_TAG }}
        draft: false
        prerelease: false
        repository: sakuraflows/deepseek-tui_winarm

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release/deepseek-tui.exe
        asset_name: deepseek-tui.exe
        asset_content_type: application/octet-stream
