name: Auto Build and Release Deepseek-TUI Windows ARM64 (Linux cross-compile)

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 0 点运行
  workflow_dispatch:     # 手动触发

jobs:
  build-win-arm:
    runs-on: ubuntu-latest
    env:
      SRC_REPO: Hmbown/DeepSeek-TUI
      RELEASE_REPO: sakuraflows/deepseek-tui_winarm
      LLVM_VERSION: 22.1.6

    steps:
    - name: Checkout self repo
      uses: actions/checkout@v3

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true

    - name: Add Rust target for Windows ARM64
      run: rustup target add aarch64-pc-windows-msvc

    # ==========================
    # 获取源项目最新 tag
    # ==========================
    - name: Get latest tag from source repo
      id: latest_tag
      shell: bash
      run: |
        git init src
        cd src
        git remote add origin https://github.com/${SRC_REPO}.git
        git fetch --tags --quiet
        LATEST_TAG=$(git tag --sort=-creatordate | head -n1)
        echo "Latest tag: $LATEST_TAG"
        echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
    # ==========================
    # 检查 release 是否已存在
    # ==========================
    - name: Check if release already exists
      id: check_release
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: 'sakuraflows',
            repo: 'deepseek-tui_winarm',
          });
          const exists = releases.data.some(r => r.tag_name === process.env.LATEST_TAG);
          if (exists) {
            core.info(`Release with tag ${process.env.LATEST_TAG} already exists. Skipping build.`);
            core.setOutput('skip', 'true');
          } else {
            core.setOutput('skip', 'false');
          }
    - name: Stop if release exists
      if: steps.check_release.outputs.skip == 'true'
      run: exit 0

    # ==========================
    # Checkout 源代码
    # ==========================
    - name: Checkout source repo at latest tag
      run: git clone --branch $LATEST_TAG https://github.com/${SRC_REPO}.git deepseek-tui

    # ==========================
    # 缓存 Rust/Cargo
    # ==========================
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          **/target
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # ==========================
    # 安装交叉编译工具链（修正版）
    # ==========================
    - name: Install cross compile tools
      run: |
        # 不再添加 arm64 架构，直接安装原生 amd64 的交叉工具包
        sudo apt install -y gcc-aarch64-linux-gnu mingw-w64

    # ==========================
    # 构建 Windows ARM64 exe
    # ==========================
    - name: Build Deepseek-TUI exe
      run: |
        cd deepseek-tui
        env:
          AWS_LC_SYS_NO_ASM: 1
        cargo build --release --target aarch64-pc-windows-msvc

    # ==========================
    # 准备 artifacts
    # ==========================
    - name: Prepare artifacts
      run: |
        mkdir release
        cp deepseek-tui/target/aarch64-pc-windows-msvc/release/deepseek-tui.exe release/

    # ==========================
    # 创建 GitHub Release
    # ==========================
    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.LATEST_TAG }}
        release_name: ${{ env.LATEST_TAG }}
        draft: false
        prerelease: false
        repository: sakuraflows/deepseek-tui_winarm

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: release/deepseek-tui.exe
        asset_name: deepseek-tui.exe
        asset_content_type: application/octet-stream
